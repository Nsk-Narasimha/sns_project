{% extends "base.html" %}


{% block title %}
forgotpassword - SNS
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>forgot password</h1>

    <p class="form-subtitle">
        Reset your password.
    </p>

    {% if res %}
    <p style="color:aquamarine;">{{res}}</p>
    {% endif %}
    {% if err %}
    <p style="color:brown;">{{err}}</p>
    {% endif %}
    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>





        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Reset Password
        </button>
        
    </form>


   
</div>

{% endblock %}
