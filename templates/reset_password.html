{% block content %}

<div class="form-container">

    <h1>reset password</h1>

    <p class="form-subtitle">
        Reset your password.
    </p>

    {% if res %}
    <p style="color:aquamarine;">{{res}}</p>
    {% endif %}
    {% if err %}
    <p style="color:brown;">{{err}}</p>
    {% endif %}
    <form
        method="POST"
        action="{{ url_for('reset_password', token=token) }}"
    >

        <div class="form-group">

            <label for="new_password">
                Password
            </label>

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter your new password"
                required
            >

        </div>
        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="repeat the password"
                required
            >




        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Reset Password
        </button>
        
    </form>


   
</div>

{% endblock %}
