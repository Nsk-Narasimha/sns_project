{% extends "base.html" %}


{% block title %}
verify - SNS
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>verify Account</h1>

    <p class="form-subtitle">
        Verify  to start managing your notes.
    </p>


    <form
        method="POST"
        action="{{ url_for('verify') }}"
    >

        <div class="form-group">

            <label for="otp">
                OTP
            </label>

            <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter OTP"
                required
            >

        </div>






        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Verify
        </button>

    </form>


    <p class="form-footer">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
</p><br/>
<span style="color:brown">{{err}}</span>
    </p>

</div>

{% endblock %}
